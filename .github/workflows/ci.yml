name: Validación del repositorio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar enlaces, frontmatter, portabilidad, clasificación y diversidad
        run: python3 tools/check-repo.py
      - name: Ejecutar pruebas unitarias
        run: python3 -m unittest discover -s tests -v
